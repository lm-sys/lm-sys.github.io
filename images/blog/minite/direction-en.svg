<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 493" role="img" aria-label="Update Direction Determines Local Mismatch Risk"><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#35513e} [data-tip]{cursor:default}</style><rect width="760" height="493" fill="white"/><text x="25" y="28" font-size="17" font-weight="600">Update Direction Determines Local Mismatch Risk</text><g transform="translate(0 44)"><rect width="760" height="315" fill="white"></rect><text x="22" y="24" fill="#35513e" font-size="14">Local signs: colors indicate amplification or contraction</text><rect x="110" y="55" width="275" height="108" rx="6" fill="#dcebe7"></rect><text x="247" y="88" fill="#35513e" font-size="14" text-anchor="middle">A &gt; 0; δ &lt; 0</text><text x="247" y="120" fill="#35513e" font-size="14" text-anchor="middle">Locally contracts gap</text><rect x="400" y="55" width="275" height="108" rx="6" fill="#f7e7d2"></rect><text x="537" y="88" fill="#35513e" font-size="14" text-anchor="middle">A &gt; 0; δ &gt; 0</text><text x="537" y="120" fill="#35513e" font-size="14" text-anchor="middle">Locally amplifies gap</text><rect x="110" y="175" width="275" height="108" rx="6" fill="#f7e7d2" stroke="#254f36" stroke-width="3"></rect><text x="247" y="208" fill="#35513e" font-size="14" text-anchor="middle">A &lt; 0; δ &lt; 0</text><text x="247" y="240" fill="#35513e" font-size="14" text-anchor="middle">Locally amplifies gap</text><text x="247" y="265" fill="#35513e" font-size="14" text-anchor="middle">TRIAGE gate direction condition</text><rect x="400" y="175" width="275" height="108" rx="6" fill="#dcebe7"></rect><text x="537" y="208" fill="#35513e" font-size="14" text-anchor="middle">A &lt; 0; δ &gt; 0</text><text x="537" y="240" fill="#35513e" font-size="14" text-anchor="middle">Locally contracts gap</text></g><text x="25" y="383" font-size="11">The learner underestimates and negative advantage lowers probability further. This meets the TRIAGE gate</text><text x="25" y="403" font-size="11">direction condition; attenuation also depends on segment mean gap and tail risk. · Change the signs of</text><text x="25" y="423" font-size="11">advantage and gap to inspect local amplification or contraction and TRIAGE&#39;s direction condition. This</text><text x="25" y="443" font-size="11">illustrates the local analysis in Section 2.4. Gate activation also depends on segment risk, and actual</text><text x="25" y="463" font-size="11">updates depend on cross-token coupling and the optimizer.</text></svg>