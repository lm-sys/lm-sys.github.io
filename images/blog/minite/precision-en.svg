<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" role="img" aria-label="NVFP4 Forward with Independently Configured Backward Precision"><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#35513e} [data-tip]{cursor:default}</style><rect width="760" height="478" fill="white"/><text x="25" y="28" font-size="17" font-weight="600">NVFP4 Forward with Independently Configured Backward Precision</text><g transform="translate(0 44)"><rect width="760" height="300" fill="white"></rect><text x="25" y="25" fill="#35513e" font-size="14">NVFP4 forward stays fixed; select dgrad/wgrad precision independently</text><rect x="25" y="62" width="210" height="72" rx="6" fill="#e9eef3"></rect><text x="130" y="92" fill="#35513e" font-size="14" text-anchor="middle">Original BF16 X, W</text><text x="130" y="118" fill="#35513e" font-size="14" text-anchor="middle">Saved for backward</text><line x1="235" y1="98" x2="282" y2="98" stroke="#6f8878" stroke-width="2"></line><rect x="282" y="62" width="213" height="72" rx="6" fill="#dcebe7"></rect><text x="388" y="105" fill="#35513e" font-size="14" text-anchor="middle">NVFP4 quantize</text><line x1="495" y1="98" x2="544" y2="98" stroke="#6f8878" stroke-width="2"></line><rect x="544" y="62" width="192" height="72" rx="6" fill="#dcebe7"></rect><text x="640" y="92" fill="#35513e" font-size="14" text-anchor="middle">NVFP4 fprop</text><text x="640" y="118" fill="#35513e" font-size="14" text-anchor="middle">GEMM</text><path d="M130 134 V219 H282" fill="none" stroke="#309576" stroke-width="2"></path><rect x="282" y="180" width="454" height="88" rx="6" fill="#f3f0f7"></rect><text x="509" y="215" fill="#35513e" font-size="14" text-anchor="middle">BF16 dgrad / wgrad</text><text x="509" y="246" fill="#35513e" font-size="14" text-anchor="middle">Uses saved original BF16 operands</text></g><text x="25" y="368" font-size="11">BF16 backward retains high-precision operands and reduces quantization preparation. In the main learner</text><text x="25" y="388" font-size="11">test, this path achieves about 1.33–1.37× paired speedups over BF16. · The diagram shows the forward and</text><text x="25" y="408" font-size="11">two backward choices measured for both miniTE paths. BF16 backward uses saved original BF16 operands;</text><text x="25" y="428" font-size="11">changing backward precision leaves the NVFP4 forward path unchanged. The static version shows BF16</text><text x="25" y="448" font-size="11">backward.</text></svg>