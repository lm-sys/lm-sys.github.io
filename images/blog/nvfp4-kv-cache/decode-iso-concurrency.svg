<text x="110" y="1062.5" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#63746A">Peak-batch decode TPS is the median throughput at the achieved peak batch; higher is better.</text>
<text x="110" y="1108.5" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#63746A">Achieved concurrency counts decode-resident requests. Displayed TPS values are rounded.</text>
<text x="110" y="1154.5" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#63746A">* 1M is a performance-only context override (native limit: 262,144). Static memory fraction: FP8 0.90 / NVFP4 0.75 at 1M;</text>
