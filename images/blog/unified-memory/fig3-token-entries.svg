<text x="252.0" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle">L1</text>
<rect x="287" y="177" width="44" height="32" rx="3" fill="#6F4DA0"/>
<text x="309.0" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle">d0</text>
