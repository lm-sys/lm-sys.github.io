<rect x="531" y="177" width="44" height="32" rx="3" fill="#6F4DA0"/>
<text x="553.0" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle">d0</text>
<rect x="579" y="177" width="44" height="32" rx="3" fill="#6F4DA0"/>
<text x="601.0" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle">d1</text>
<text x="511.0" y="238" font-size="15" fill="#0B0B0B" text-anchor="middle" font-weight="600">token t + 1</text>
