<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker></defs>
<line x1="221" y1="72" x2="240.0" y2="72" stroke="#52514E" stroke-width="1.5" marker-start="url(#ah)"/>
<text x="308.0" y="77" font-size="15" fill="#52514E" text-anchor="middle">stride = 1 entry</text>
<line x1="376.0" y1="72" x2="395" y2="72" stroke="#52514E" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="24" y="288" font-size="15" fill="#52514E" text-anchor="start">L0, L1: target layers · d0, d1: draft lanes, which can be a different size</text>
<text x="24" y="310" font-size="16" fill="#0B0B0B" text-anchor="start" font-weight="600">Same token id, one allocation, one move.</text>
</svg>
