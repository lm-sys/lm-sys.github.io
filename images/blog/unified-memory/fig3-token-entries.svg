<svg xmlns="http://www.w3.org/2000/svg" width="900" height="316" viewBox="0 0 900 316" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Token-major entries and strided per-lane views. Bottom: one physical page of consecutive token entries, all the same size. Each entry holds two target layers, L0 and L1, and two speculative-draft lanes, draft 0 and draft 1, in the same order; the draft rows are drawn narrower than the target rows to show that the two can differ in size. Top: the target layer 0 view and the draft lane 0 view, each a token-by-payload tensor; every cell is joined by a vertical line to its lane in the entry for the same token, so consecutive cells of a view are one whole entry apart in memory (stride). Because rows of different sizes share one entry, target and draft use the same token id, and one allocation, free or whole-page move carries both.">
<title>Per-layer views are strided windows onto token-major entries that hold target rows and differently sized draft lanes</title>
<rect width="900" height="316" fill="#FFFFFF"/>
<text x="24" y="26" font-size="17" fill="#0B0B0B" text-anchor="start" font-weight="600">Target and draft rows packed in one entry per token</text>
<text x="24" y="77" font-size="15" fill="#0B0B0B" text-anchor="start">target layer 0</text>
<text x="24" y="133" font-size="15" fill="#0B0B0B" text-anchor="start">draft lane 0</text>
<text x="24" y="192" font-size="15" fill="#0B0B0B" text-anchor="start" font-weight="600">Physical page</text>
<text x="24" y="209" font-size="13" fill="#52514E" text-anchor="start">entry per token</text>
