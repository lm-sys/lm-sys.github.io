<title id="t">Per-user decode speed and output throughput per GPU, plugin off and on</title>
<desc id="d">DeepSeek-V4.1-Flash on four GB300 GPUs at 1, 2, 4 and 8 concurrent requests. x: per-user decode speed (tokens/s per user). y: aggregate output throughput per GPU including prefill. Plugin on is to the right of plugin off at every concurrency.</desc>
