<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" role="img" aria-label="NVFP4 Encoding and Two-Level Scaling"><style>text{font-family:Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#35513e} [data-tip]{cursor:default}</style><rect width="760" height="468" fill="white"/><text x="25" y="28" font-size="17" font-weight="600">NVFP4 Encoding and Two-Level Scaling</text><g transform="translate(0 44)"><rect width="760" height="310" fill="white"></rect><text x="30" y="30" fill="#35513e" font-size="14">Nonnegative E2M1 values (sign bit selects positive/negative)</text><line x1="66" y1="100" x2="686" y2="100" stroke="#b3c5b8" stroke-width="2"></line><circle cx="66" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 0" tabindex="0" aria-label="E2M1: 0"></circle><text x="66" y="132" fill="#35513e" text-anchor="middle" font-size="20">0</text><circle cx="117.66666666666666" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 0.5" tabindex="0" aria-label="E2M1: 0.5"></circle><text x="117.66666666666666" y="132" fill="#35513e" text-anchor="middle" font-size="20">0.5</text><circle cx="169.33333333333331" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 1" tabindex="0" aria-label="E2M1: 1"></circle><text x="169.33333333333331" y="132" fill="#35513e" text-anchor="middle" font-size="20">1</text><circle cx="221" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 1.5" tabindex="0" aria-label="E2M1: 1.5"></circle><text x="221" y="132" fill="#35513e" text-anchor="middle" font-size="20">1.5</text><circle cx="272.66666666666663" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 2" tabindex="0" aria-label="E2M1: 2"></circle><text x="272.66666666666663" y="132" fill="#35513e" text-anchor="middle" font-size="20">2</text><circle cx="376" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 3" tabindex="0" aria-label="E2M1: 3"></circle><text x="376" y="132" fill="#35513e" text-anchor="middle" font-size="20">3</text><circle cx="479.3333333333333" cy="100" r="4" fill="#a9b9ae" data-tip="E2M1: 4" tabindex="0" aria-label="E2M1: 4"></circle><text x="479.3333333333333" y="132" fill="#35513e" text-anchor="middle" font-size="20">4</text><circle cx="686" cy="100" r="8" fill="#309576" data-tip="E2M1: 6" tabindex="0" aria-label="E2M1: 6"></circle><text x="686" y="132" fill="#35513e" text-anchor="middle" font-size="20">6</text><rect x="28" y="170" width="704" height="83" rx="6" fill="#f2f7f1"></rect><text x="48" y="202" fill="#35513e" font-size="18">q = 6, block scale = 1, outer scale = 1</text><text x="48" y="232" fill="#35513e" font-size="18">Reconstructed x̂ = q × block scale × outer scale = 6</text><text x="30" y="285" fill="#35513e" font-size="14">16 × 4 bits = 8 bytes; add 1 byte E4M3 scale per block.</text></g><text x="25" y="378" font-size="11">Exponent 11: |q| = (1 + 1/2) × 2^(3−1) = 6. Exponent 11 is finite in E2M1; the maximum is 6. · E2M1 data</text><text x="25" y="398" font-size="11">occupy 4 bits. Each block of 16 elements shares an E4M3 scale, with an additional outer FP32 scale. Click</text><text x="25" y="418" font-size="11">the payload bits and change the scales to inspect finite values and reconstruction. The example scales</text><text x="25" y="438" font-size="11">are representable values.</text></svg>