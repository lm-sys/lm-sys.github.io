<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="691" viewBox="24 0 1392 691" role="img" aria-labelledby="title desc"><title id="title">Zero-Overhead Scheduling</title><desc id="desc">Schematic CPU and GPU timelines. Sequential scheduling leaves the GPU idle while the CPU prepares each next batch. SGLang overlaps preparation of step N+1 on the CPU with execution of step N on the GPU, hiding scheduling work behind GPU execution in steady state. The first preparation is startup. Block lengths are illustrative, not measured timings or a guarantee for every workload.</desc><defs><marker id="time-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8b8981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="1440" height="691" fill="#ffffff" /><g font-family="Arial, Helvetica, sans-serif" fill="#0b0b0b"><text x="720" y="59.84" text-anchor="middle" font-size="34" font-weight="600" fill="#171717">Zero-Overhead Scheduling</text><text x="720" y="127.6" text-anchor="middle" font-size="22" fill="#77756e">Time</text><path d="M90 145.2 H1340" fill="none" stroke="#8b8981" stroke-width="2.5" marker-end="url(#time-arrow)" /><g transform="translate(0 35.2)"><text x="720" y="177.76" text-anchor="middle" font-size="26" font-weight="600" fill="#52514e">Sequential</text><text x="720" y="383.84" text-anchor="middle" font-size="26" font-weight="600" fill="#d65221">SGLang Overlap</text><text x="100" y="227.04" transform="translate(0 0)" font-size="25" font-weight="600" fill="#287346">CPU</text><text x="100" y="249.04" transform="translate(0 0)" font-size="18" fill="#52514e">schedule</text><text x="100" y="306.24" transform="translate(0 0)" font-size="25" font-weight="600" fill="#19599e">GPU</text><text x="100" y="227.04" transform="translate(0 206.08)" font-size="25" font-weight="600" fill="#287346">CPU</text><text x="100" y="249.04" transform="translate(0 206.08)" font-size="18" fill="#52514e">schedule</text><text x="100" y="306.24" transform="translate(0 206.08)" font-size="25" font-weight="600" fill="#19599e">GPU</text><rect x="270" y="198.88" width="108" height="51.04" rx="2" fill="#e7f1e9" stroke-width="1.2" /><text x="324.0" y="231.44" text-anchor="middle" font-size="22" font-weight="600" fill="#287346">N</text><rect x="386" y="275.44" width="232" height="51.04" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" /><text x="502.0" y="308" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Step N</text><rect x="626" y="198.88" width="108" height="51.04" rx="2" fill="#e7f1e9" stroke-width="1.2" /><text x="680.0" y="231.44" text-anchor="middle" font-size="22" font-weight="600" fill="#287346">N+1</text><rect x="742" y="275.44" width="232" height="51.04" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" /><text x="858.0" y="308" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Step N+1</text><rect x="626" y="275.44" width="108" height="51.04" rx="3" fill="#f3f3ef" stroke="#cfcec6" stroke-width="1.2" stroke-dasharray="5 4" /><text x="680" y="308" text-anchor="middle" font-size="21" fill="#77756e">Idle</text><rect x="982" y="198.88" width="108" height="51.04" rx="2" fill="#e7f1e9" stroke-width="1.2" /><text x="1036.0" y="231.44" text-anchor="middle" font-size="22" font-weight="600" fill="#287346">N+2</text><rect x="1098" y="275.44" width="232" height="51.04" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2" /><text x="1214.0" y="308" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Step N+2</text><rect x="982" y="275.44" width="108" height="51.04" rx="3" fill="#f3f3ef" stroke="#cfcec6" stroke-width="1.2" stroke-dasharray="5 4" /><text x="1036" y="308" text-anchor="middle" font-size="21" fill="#77756e">Idle</text><rect x="270" y="404.96" width="108" height="51.04" rx="2" fill="#e7f1e9" stroke-width="1.2" /><text x="324.0" y="437.52" text-anc