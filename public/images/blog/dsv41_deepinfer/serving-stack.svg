<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="690" viewBox="24 0 1392 690" role="img" aria-labelledby="title desc">
<title id="title">SGLang Serving Stack</title>
<desc id="desc">Frontend and DeepSeek Recipe handle the API, prompt encoding and output parsing. Prefill and decode each have a local Unified Radix Tree, Linker and an L1 GPU cache. Linker connects L1 directly to configured shared L3 storage, without an L2 host tier. Prefill transfers KV to decode through Mooncake or NIXL.</desc>
