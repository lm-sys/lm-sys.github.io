<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="655" viewBox="24 0 1392 655" role="img" aria-labelledby="title desc"><title id="title">Engram placement: both supported in SGLang</title><desc id="desc">SGLang supports Engram tables in host memory and sharded across GPU memory. The host-memory diagram shows GPUs accessing shared host tables. The GPU-memory diagram shows local shards accessed directly across NVLink using SGLang's P2P lookup. These are placement options, not a claim that both frameworks use identical lookup implementations. Two GPUs are schematic.</desc><defs><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#368354" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2a78d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="1440" height="655" fill="#ffffff" /><g font-family="Arial, Helvetica, sans-serif" fill="#0b0b0b"><text x="720" y="67.76" text-anchor="middle" font-size="34" font-weight="600" fill="#171717">Engram Placement</text><text x="380" y="155.76" text-anchor="middle" font-size="28" font-weight="600" fill="#287346">Host Memory</text><text x="1060" y="155.76" text-anchor="middle" font-size="28" font-weight="600" fill="#19599e">GPU Memory</text><text x="380" y="208.56" text-anchor="middle" font-size="23" font-weight="600" fill="#287346">Engram tables</text><rect x="132" y="227.92" width="496" height="110.88" rx="2" fill="#f0f6f1" stroke-width="1.5" /><rect x="150" y="244.64" width="31" height="20.24" rx="1.5" fill="#aad1b7" /><rect x="150" y="271.92" width="31" height="20.24" rx="1.5" fill="#aad1b7" /><rect x="150" y="299.2" width="31" height="20.24" rx="1.5" fill="#aad1b7