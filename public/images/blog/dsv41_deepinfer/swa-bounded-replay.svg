<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="772" viewBox="24 0 1392 772" role="img" aria-labelledby="title desc"><title id="title">SWA Bounded Replay</title><desc id="desc">Decoder replay keeps early and source-layer work over all extend tokens, including compressed KV writes, and runs late-layer work on at most the last 128 extend tokens per request. On a prefix-cache hit with a missing SWA window, encoder replay reuses compressed KV and rebuilds the window from at most the last 128 cached-prefix tokens. Token widths are schematic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2a78d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></marker></defs><rect width="1440" height="772" fill="#ffffff" /><g font-family="Arial, Helvetica, sans-serif" fill="#0b0b0b"><text x="720" y="59.84" text-anchor="middle" font-size="34" font-weight="600" fill="#171717">SWA Bounded Replay</text><text x="90" y="139.04" font-size="27" font-weight="600" fill="#19599e">Decoder Replay</text><text x="575" y="186.56" text-anchor="middle" font-size="23" fill="#52514e">All extend tokens</text><text x="1150" y="186.56" text-anchor="middle" font-size="23" font-weight="600" fill="#19599e">Last &lt;= 128 tokens</text><text x="90" y="232.32" font-size="23" font-weight="600">Early / source</text><text x="90" y="256.96" font-size="23" font-weight="600">layers</text><text x="90" y="336.16" font-size="23" font-weight="600">Late layers</text><rect x="310" y="208.56" width="34" height="51.92" rx="0" fill="#c9def6" /><rect x="310" y="306.24" width="34" height="51.92" rx="0" fill="#f4f4f2" /><rect x="354" y="208.56" width="34" height="51.92" rx="0" fill="#c9def6" /><rect x="354" y="306.24" width="34" height="51.92" rx="0" fill="#f4f4f2" /><rect x="398" y="208.56" width="34" height="51.92" rx="0" fill="#c9def6" /><rect x="398" y="306.24" width="34" height="5