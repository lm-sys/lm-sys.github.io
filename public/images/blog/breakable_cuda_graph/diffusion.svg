<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 512" width="1020" height="512" role="img" aria-labelledby="diffusion-bcg-chart-title diffusion-bcg-chart-desc">
  <title id="diffusion-bcg-chart-title">SGLang diffusion end-to-end latency with eager execution and Breakable CUDA Graph</title>
  <desc id="diffusion-bcg-chart-desc">Five model workloads normalized independently to their eager latency. Breakable CUDA Graph reduces end-to-end latency for launch-bound diffusion models on B200 and H200.</desc>
  <rect width="1020" height="512" fill="#ffffff"/>
  <text x="40" y="40" font-size="16" font-weight="700" fill="#111827">Diffusion latency after warmup — eager vs BCG</text>
  <text x="40" y="61" font-size="12" fill="#6b7280">Each row is normalized to its own eager baseline · shorter is better · absolute e2e latency shown at right</text>
  <g font-size="12" fill="#374151">
    <rect x="790" y="30" width="12" height="12" rx="2" fill="#d1d5db"/><text x="808" y="40">eager</text>
    <rect x="866" y="30" width="12" height="12" rx="2" fill="#4e79a7"/><text x="884" y="40">BCG</text>
  </g>

  <text x="40" y="103" font-size="13" font-weight="700" fill="#111827">B200 · single GPU</text>
  <g font-size="10.5" fill="#9ca3af" text-anchor="middle">
    <text x="310" y="103">0</text><text x="400" y="103">25%</text><text x="490" y="103">50%</text><text x="580" y="103">75%</text><text x="670" y="103">100%</text>
  </g>
  <text x="704" y="103" font-size="10.5" fill="#9ca3af">eager → BCG</text>
  <text x="914" y="103" font-size="10.5" fill="#9ca3af">speedup</text>
  <g stroke="#f1f3f5" stroke-width="1">
    <line x1="310" y1="112" x2="310" y2="277"/><line x1="400" y1="112" x2="400" y2="277"/><line x1="490" y1="112" x2="490" y2="277"/><line x1="580" y1="112" x2="580" y2="277"/><line x1="670" y1="112" x2="670" y2="277"/>
  </g>

  <g font-size="12">
    <text x="40" y="136" font-weight="700" fill="#111827">Qwen-Image</text><text x="40" y="153" font-size="10.5" fill="#9ca3af">512×512</text>
    <rect x="310" y="121" width="360" height="14" rx="2" fill="#d1d5db"/><rect x="310" y="141" width="136" height="14" rx="2" fill="#4e79a7"/>
    <text x="704" y="143" fill="#374151">6.480 → 2.450 s</text><text x="914" y="143" font-weight="700" fill="#166534">2.64×</text>

    <text x="40" y="192" font-weight="700" fill="#111827">Z-Image</text><text x="40" y="209" font-size="10.5" fill="#9ca3af">256×256</text>
    <rect x="310" y="177" width="360" height="14" rx="2" fill="#d1d5db"/><rect x="310" y="197" width="194" height="14" rx="2" fill="#4e79a7"/>
    <text x="704" y="199" fill="#374151">1.231 → 0.662 s</text><text x="914" y="199" font-weight="700" fill="#166534">1.86×</text>

    <text x="40" y="248" font-weight="700" fill="#111827">Ideogram 4</text><text x="40" y="265" font-size="10.5" fill="#9ca3af">512×512</text>
    <rect x="310" y="233" width="360" height="14" rx="2" fill="#d1d5db"/><rect x="310" y="253" width="220" height="14" rx="2" fill="#4e79a7"/>
    <text x="704" y="255" fill="#374151">1.625 → 0.991 s</text><text x="914" y="255" font-weight="700" fill="#166534">1.64×</text>
  </g>

  <line x1="40" y1="297" x2="980" y2="297" stroke="#e5e7eb"/>
  <text x="40" y="321" font-size="13" font-weight="700" fill="#111827">H200</text>
  <g font-size="12">
    <text x="40" y="354" font-weight="700" fill="#111827">SANA1.5-1.6B</text><text x="40" y="371" font-size="10.5" fill="#9ca3af">1024×1024 · 1 GPU · 20 steps</text>
    <rect x="310" y="339" width="360" height="14" rx="2" fill="#d1d5db"/><rect x="310" y="359" width="267" height="14" rx="2" fill="#4e79a7"/>
    <text x="704" y="361" fill="#374151">0.821 → 0.608 s</text><text x="914" y="361" font-weight="700" fill="#166534">1.35×</text>

    <text x="40" y="410" font-weight="700" fill="#111827">LTX-2 two-stage</text><text x="40" y="427" font-size="10.5" fill="#9ca3af">768×512×121f · 2 GPUs · CFG parallel</text>
    <rect x="310" y="395" width="360" height="14" rx="2" fill="#d1d5db"/><rect x="310" y="415" width="291" height="14" rx="2" fill="#4e79a7"/>
    <text x="704" y="417" fill="#374151">8.538 → 6.893 s</text><text x="914" y="417" font-weight="700" fill="#166534">1.24×</text>
  </g>

  <line x1="40" y1="450" x2="980" y2="450" stroke="#e5e7eb"/>
  <text x="40" y="474" font-size="11.5" fill="#6b7280">Bars compare only eager and BCG within each row; workloads, step counts, resolutions, and hardware differ across rows.</text>
  <text x="40" y="493" font-size="11.5" fill="#6b7280">BCG targets exposed launch gaps. It does not reduce model FLOPs, text encoding, or VAE work.</text>
</svg>