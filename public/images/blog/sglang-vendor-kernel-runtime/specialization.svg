<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">More specialization means more code to maintain</title>
<desc id="desc">Hardware, models, parallel configurations and workloads lead to specialized kernel implementations. Each implementation needs code review, correctness testing, performance validation and ongoing maintenance. This is a conceptual illustration, not a support matrix.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#8795aa"/></marker></defs>
<rect width="1100" height="500" rx="16" fill="#f7f9fc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#243247}.heading{font-size:21px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#52637a}.line{stroke:#8795aa;stroke-width:2;fill:none}</style>
<text x="38" y="45" class="heading">More specialization means more code to maintain</text>
<text x="38" y="88" class="small">Sources of variation</text>
<text x="405" y="88" class="small">Specialized implementations</text>
<text x="807" y="88" class="small">Work for each implementation</text>
