<svg xmlns="http://www.w3.org/2000/svg" width="960" height="586" viewBox="0 0 960 586" role="img" aria-labelledby="t d">
<title id="t">One DeepSeek-V4.1 layer at batch size 1: SGLang's standard path and the AMD plugin</title>
<desc id="d">SGLang's standard path runs the layer as dozens of small kernels with an idle gap at every launch boundary and two all-reduces during which no computation runs. The AMD plugin runs it as two persistent launches, K1 and K2: weights that do not depend on routing load early, and partial sums go to the peer GPUs while computation continues.</desc>
