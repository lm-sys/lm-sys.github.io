<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330"><rect width="1080" height="330" fill="#f6f8fc"/><style>text{font-family:Arial,sans-serif;fill:#18243b}.title{font-size:24px;font-weight:bold}.label{font-size:20px;font-weight:bold}.body{font-size:17px}</style><text x="40" y="44" class="title">Vendor kernels in SGLang: from startup to graph replay</text><rect x="30" y="80" width="300" height="190" rx="14" fill="#e1ecff"/><rect x="390" y="80" width="300" height="190" rx="14" fill="#e2f4ed"/><rect x="750" y="80" width="300" height="190" rx="14" fill="#eee7ff"/><text x="52" y="118" class="label">1. Startup</text><text x="52" y="155" class="body">Register and validate the spec</text><text x="52" y="185" class="body">Bind weights; build resources</text><text x="52" y="215" class="body">Wrap the model forward</text><text x="412" y="118" class="label">2. Graph capture</text><text x="412" y="155" class="body">Choose path for capture shape</text><text x="412" y="185" class="body">Plugin or standard operations</text><text x="412" y="215" class="body">Record the GPU sequence</text><text x="772" y="118" class="label">3. Serving</text><text x="772" y="155" class="body">Stage inputs and metadata</text><text x="772" y="185" class="body">Select a captured graph</text><text x="772" y="215" class="body">Replay recorded GPU work</text><path d="M340 175h35m-10-8 10 8-10 8M700 175h35m-10-8 10 8-10 8" fill="none" stroke="#61738e" stroke-width="3"/><text x="40" y="307" class="body">Eager steps call the dispatcher directly; graph replay reuses the choice made during capture.</text></svg>