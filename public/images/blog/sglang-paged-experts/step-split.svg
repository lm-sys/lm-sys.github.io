<rect x="342.4" y="116" width="18" height="18" rx="3" fill="#368354"/>
<text x="368.4" y="131" font-size="18" fill="#52514e" text-anchor="start">routed expert GEMMs</text>
<rect x="584.8" y="116" width="18" height="18" rx="3" fill="#c9c8c3"/>
<text x="610.8" y="131" font-size="18" fill="#52514e" text-anchor="start">dense layers, attention, other</text>
<line x1="400.0" y1="192" x2="400.0" y2="468" stroke="#e6e5e1" stroke-width="1"/>
<text x="400.0" y="494" font-size="18" fill="#52514e" text-anchor="middle">0</text>
<line x1="537.1" y1="192" x2="537.1" y2="468" stroke="#e6e5e1" stroke-width="1"/>
<text x="537.1" y="494" font-size="18" fill="#52514e" text-anchor="middle">2</text>
<line x1="674.3" y1="192" x2="674.3" y2="468" stroke="#e6e5e1" stroke-width="1"/>
<text x="674.3" y="494" font-size="18" fill="#52514e" text-anchor="middle">4</text>
<line x1="811.4" y1="192" x2="811.4" y2="468" stroke="#e6e5e1" stroke-width="1"/>
<text x="811.4" y="494" font-size="18" fill="#52514e" text-anchor="middle">6</text>
<line x1="948.6" y1="192" x2="948.6" y2="468" stroke="#e6e5e1" stroke-width="1"/>
<text x="948.6" y="494" font-size="18" fill="#52514e" text-anchor="middle">8</text>
<line x1="1085.7" y1="192" x2="1085.7" y2="468" stroke="#e6e5e1" stroke-width="1"/>
<text x="1085.7" y="494" font-size="18" fill="#52514e" text-anchor="middle">10</text>
<text x="760.0" y="528" font-size="19" fill="#52514e" text-anchor="middle">ms per decode step</text>
<rect x="400.0" y="210" width="12.4" height="40" fill="#d65221"/>
<rect x="414.4" y="210" width="5.5" height="40" fill="#2a78d6"/>
