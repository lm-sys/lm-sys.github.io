<text x="368.4" y="131" font-size="18" fill="#52514e" text-anchor="start">routed expert GEMMs</text>
<rect x="584.8" y="116" width="18" height="18" rx="3" fill="#c9c8c3"/>
<text x="610.8" y="131" font-size="18" fill="#52514e" text-anchor="start">dense layers, attention, other</text>
<line x1="400.0" y1="192" x2="400.0" y2="468" stroke="#e6e5e1" stroke-width="1"/>
