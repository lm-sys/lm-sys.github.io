<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" role="img" aria-labelledby="title desc">
<title id="title">Where a decode step goes</title>
<desc id="desc">Stacked horizontal bars of one decode step's kernel time in ms, split into expert copies, decide, routed expert GEMMs and the rest: Qwen3-30B-A3B GPTQ-Int4: expert copies 0.195, decide 0.110, routed expert GEMMs 1.417, dense layers, attention, other 2.654; Qwen3-30B-A3B FP8: expert copies 3.525, decide 0.124, routed expert GEMMs 2.606, dense layers, attention, other 3.569; Qwen3-Next-80B-A3B NVFP4: expert copies 1.964, decide 0.086, routed expert GEMMs 1.304, dense layers, attention, other 6.357.</desc>
