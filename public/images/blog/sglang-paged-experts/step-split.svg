<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" role="img" aria-labelledby="title desc">
<title id="title">Where a decode step goes</title>
<desc id="desc">Stacked horizontal bars of one decode step's kernel time in ms, split into expert copies, decide, routed expert GEMMs and the rest: Qwen3-30B-A3B GPTQ-Int4: expert copies 0.21, decide 0.11, routed expert GEMMs 1.41, dense layers, attention, other 2.60; Qwen3-30B-A3B FP8: expert copies 3.52, decide 0.18, routed expert GEMMs 2.40, dense layers, attention, other 3.60; Qwen3-Next-80B-A3B NVFP4: expert copies 2.36, decide 0.27, routed expert GEMMs 1.22, dense layers, attention, other 6.36.</desc>
<rect width="1200" height="554" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="52" font-size="32" fill="#171717" font-weight="700" text-anchor="start">Where a decode step goes</text>
<text x="40" y="84" font-size="20" fill="#52514e" text-anchor="start">One request, decode captured in a CUDA graph · traced kernel time per step, ms · RTX 5070 Ti 16 GB</text>
<rect x="40" y="116" width="18" height="18" rx="3" fill="#d65221"/>
<text x="66" y="131" font-size="18" fill="#52514e" text-anchor="start">expert copies</text>
