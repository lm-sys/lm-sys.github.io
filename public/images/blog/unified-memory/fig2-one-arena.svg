<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Schematic of one arena on the same byte scale as Figure 1. Live bounded-state units, which are large, are compacted toward the low end and live full-attention KV units, which are smaller, toward the high end; the free space between them is one undivided region of bytes with no page grid. Under a long-context workload full KV can grow down into it; under many short requests bounded state can grow up into it, each in its own unit size.">
<title>One arena compacts live units toward the two ends and shares the free bytes between them</title>
