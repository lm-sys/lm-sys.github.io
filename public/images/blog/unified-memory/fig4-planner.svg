<svg xmlns="http://www.w3.org/2000/svg" width="900" height="626" viewBox="0 0 900 626" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Three arena layouts on one byte scale; each sub-pool has its own unit width: state slots are widest, window pages are narrower, and full-attention pages are narrowest. The request needs four full-attention pages. With no move, the full-attention band has three one-page holes, which is one page short, and the window band has an interior hole that it cannot give to full attention. Compacting only the two ends turns the three holes into three free pages beside the window band and still falls one short. Relocating copies the rightmost window page into the window's interior hole; the page it vacates joins the gap, so there is room for five full-attention pages beside the full band. Allocating the request then uses four of them and leaves one free.">
<title>Planner layouts: no move, compact the ends, relocate the floating window</title>
