<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Schematic of two fixed pools on one byte scale, bounded state on the low bytes with large units and full-attention KV on the high bytes with smaller units, separated by a fixed wall. Live units are scattered through each pool. Under a long-context workload the full-attention pool has no free unit while four of six bounded-state units are free and stranded. Under many short requests the bounded pool has no free unit while seventeen of twenty-four full-attention units are free and stranded. Free units on one side cannot serve the other side.">
<title>Fixed pools strand free units on the wrong side of the wall</title>
<rect width="880" height="436" fill="#FFFFFF"/>

