<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1470" viewBox="0 0 960 1470" role="img" aria-labelledby="title description">
<title id="title">Setwise: p95 latency by candidate count</title>
<desc id="description">Fused-Choice versus Setwise SIS, test split, concurrency 1. Grouped bars for 2, 5, 9, and 16 candidates on Qwen3-0.6B, Qwen3-8B, and Qwen3.5-4B. All panels share a 0 to 60 millisecond scale. Both modes show weak candidate-count dependence.</desc>
<metadata>Sundara Raman Ramachandran, 2026-09-25. Latest SGLang master; CUDA 13.0, H200, FA3, MIS off, radix cache off, chunked prefill -1 for both endpoints. Open-Jev c67699e13d0ae25e35b77165a4b6b079bedc8aba, seed 42. Load: train split, 20-second nominal Poisson arrivals, max(64,QPS) client workers. Candidate count: test split, 200 questions, concurrency 1, 1 warmup + 10 measured rounds. Values derived from verified per-run summary.json files; all 42 groups and 149440 raw samples checked. 8B ran on the original H200; complete 0.6B and 4B studies ran on a replacement H200 with restored package versions.</metadata>
