<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 680" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="680" fill="#ffffff"/>

  <!-- Title -->
  <text x="670" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Weight Cache Daemon: Zero-Copy Weight Sharing via CUDA IPC</text>

  <!-- NVMe disk (cold source, outside GPU) -->
  <g filter="url(#shadow)">
    <ellipse cx="95" cy="290" rx="58" ry="17" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <path d="M37,290 V420 A58,17 0 0 0 153,420 V290" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="95" cy="290" rx="58" ry="17" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="95" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">NVMe SSD</text>
  <text x="95" y="382" text-anchor="middle" font-size="13" fill="#475569">safetensors ~1 TB</text>

  <!-- Cold-load label (kept fully left of the GPU box) -->
  <text x="95" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">one-time cold load</text>
  <text x="95" y="492" text-anchor="middle" font-size="12.5" fill="#64748b">disk → TP shard</text>
  <text x="95" y="510" text-anchor="middle" font-size="12.5" fill="#64748b">→ quantize → repack</text>

  <!-- Cold load arrow disk -> daemon -->
  <path d="M156,300 C260,300 300,240 402,240" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowGrey)"/>

  <!-- GPU container -->
  <rect x="360" y="96" width="940" height="520" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="388" y="128" font-size="19" font-weight="700" fill="#475569">GPU i</text>

  <!-- Weight Cache Daemon box -->
  <g filter="url(#shadow)">
    <rect x="410" y="156" width="340" height="252" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="580" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Weight Cache Daemon</text>
  <text x="580" y="212" text-anchor="middle" font-size="13" font-style="italic" fill="#2563eb">persistent · one per TP rank</text>
  <line x1="436" y1="226" x2="724" y2="226" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="438" y="254" font-size="14" font-weight="600" fill="#1e3a8a">Holds in GPU memory:</text>
  <text x="452" y="280" font-size="13.5" fill="#1e40af">• TP-sharded weights (fp8)</text>
  <text x="452" y="305" font-size="13.5" fill="#1e40af">• weight_scale</text>
  <text x="452" y="330" font-size="13.5" fill="#1e40af">• workspace buffers</text>
  <text x="452" y="355" font-size="13.5" fill="#1e40af">• all post-quant params/buffers</text>
  <text x="438" y="390" font-size="12.5" fill="#2563eb">Exports every state_dict tensor as IPC handle</text>

  <!-- Engine box -->
  <g filter="url(#shadow)">
    <rect x="910" y="156" width="340" height="252" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  </g>
  <text x="1080" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">Engine (rank i)</text>
  <text x="1080" y="212" text-anchor="middle" font-size="13" font-style="italic" fill="#16a34a">new / restarted process</text>
  <line x1="936" y1="226" x2="1224" y2="226" stroke="#86efac" stroke-width="1.5"/>
  <text x="938" y="254" font-size="14" font-weight="600" fill="#14532d">On restart:</text>
  <text x="952" y="280" font-size="13.5" fill="#166534">• meta-device init (no alloc)</text>
  <text x="952" y="305" font-size="13.5" fill="#166534">• param.data → IPC tensor</text>
  <text x="952" y="330" font-size="13.5" fill="#166534">• no disk I/O · no dequant</text>
  <text x="952" y="355" font-size="13.5" fill="#166534">• sub-second ready</text>
  <text x="938" y="390" font-size="12.5" fill="#16a34a">Validates CacheConfig before mapping</text>

  <!-- ===== Gap between boxes: 750..910 (160px) ===== -->
  <!-- Zero-copy data-plane arrow -->
  <path d="M754,250 L906,250" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="828" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">cudaIpcMemHandle</text>
  <text x="828" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">zero-copy</text>

  <!-- Control-plane (short label in gap) -->
  <path d="M754,326 L906,326" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowGrey)"/>
  <path d="M906,344 L754,344" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowGrey)"/>
  <text x="828" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Unix socket</text>
  <text x="828" y="366" text-anchor="middle" font-size="11.5" fill="#64748b">handshake +</text>
  <text x="828" y="382" text-anchor="middle" font-size="11.5" fill="#64748b">config check</text>

  <!-- Shared physical memory bar -->
  <g filter="url(#shadow)">
    <rect x="410" y="470" width="840" height="96" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  </g>
  <text x="830" y="508" text-anchor="middle" font-size="18" font-weight="700" fill="#a16207">Shared physical GPU memory</text>
  <text x="830" y="533" text-anchor="middle" font-size="13.5" fill="#854d0e">a single copy of post-quantized, TP-sharded weights — mapped by both processes</text>
  <text x="830" y="554" text-anchor="middle" font-size="12" fill="#a16207">freed only when both daemon and engine exit (CUDA IPC refcount)</text>

  <!-- connectors daemon/engine -> shared memory -->
  <path d="M580,408 L580,466" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>
  <path d="M1080,408 L1080,466" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>
  <text x="595" y="446" font-size="12" fill="#b45309">owns</text>
  <text x="1095" y="446" font-size="12" fill="#b45309">maps same region</text>

  <!-- socket path caption below bar -->
  <text x="830" y="598" text-anchor="middle" font-size="12" fill="#64748b">control socket: /tmp/sglang_weight_cache_rank{i}.sock</text>
</svg>
