<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="aRed" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="aGrey" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>

  <g transform="translate(0,22)">
  <!-- header -->
  <text x="60" y="66" font-size="16" font-weight="700" letter-spacing="3" fill="#2563eb">SGLANG · FAST ENGINE RECOVERY</text>
  <text x="60" y="108" font-size="38" font-weight="800" fill="#0f172a">Weight Cache Daemon</text>
  <text x="60" y="140" font-size="20" font-weight="500" fill="#475569">A persistent daemon keeps weights in GPU memory; engines map them zero-copy on restart</text>

  <!-- GPU container -->
  <rect x="60" y="168" width="1080" height="300" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="86" y="198" font-size="16" font-weight="700" fill="#64748b">GPU i — daemon and engine share one physical copy of the weights</text>

  <!-- disk -->
  <g filter="url(#ds)">
    <ellipse cx="140" cy="288" rx="40" ry="12" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <path d="M100,288 V356 A40,12 0 0 0 180,356 V288" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="140" cy="288" rx="40" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="140" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">NVMe SSD</text>

  <!-- disk -> daemon (one-time) -->
  <path d="M184,316 L286,316" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#aGrey)"/>
  <text x="235" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">load once</text>

  <!-- daemon -->
  <g filter="url(#ds)">
    <rect x="290" y="242" width="300" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  </g>
  <text x="440" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#1d4ed8">Weight Cache Daemon</text>
  <text x="440" y="312" text-anchor="middle" font-size="14.5" font-style="italic" fill="#2563eb">persistent · survives restarts</text>
  <text x="440" y="344" text-anchor="middle" font-size="14" fill="#1e40af">holds post-quantized,</text>
  <text x="440" y="366" text-anchor="middle" font-size="14" fill="#1e40af">TP-sharded weights in GPU memory</text>

  <!-- zero-copy relationship (the core) -->
  <path d="M590,317 L706,317" fill="none" stroke="#dc2626" stroke-width="4.5" marker-end="url(#aRed)"/>
  <text x="650" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">CUDA IPC</text>
  <text x="650" y="342" text-anchor="middle" font-size="13.5" font-weight="700" fill="#dc2626">zero-copy map</text>

  <!-- engine -->
  <g filter="url(#ds)">
    <rect x="710" y="242" width="300" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  </g>
  <text x="860" y="284" text-anchor="middle" font-size="24" font-weight="800" fill="#15803d">Restarted Engine</text>
  <text x="860" y="312" text-anchor="middle" font-size="14.5" font-style="italic" fill="#16a34a">new process · meta-device init</text>
  <text x="860" y="344" text-anchor="middle" font-size="14" fill="#166534">maps weights directly —</text>
  <text x="860" y="366" text-anchor="middle" font-size="14" fill="#166534">no disk I/O, no dequant, ready &lt; 1s</text>

  <!-- shared memory band under both -->
  <path d="M440,392 L440,412" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 5"/>
  <path d="M860,392 L860,412" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 5"/>
  <g filter="url(#ds)">
    <rect x="290" y="414" width="720" height="40" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  </g>
  <text x="650" y="440" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a16207">Shared physical GPU memory — one copy, mapped by both</text>

  <!-- metric strip -->
  <g filter="url(#ds)">
    <rect x="60" y="500" width="520" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <text x="320" y="540" text-anchor="middle" font-size="27" font-weight="800" fill="#1d4ed8">weight load: minutes → &lt; 1s</text>
  <text x="320" y="565" text-anchor="middle" font-size="14" fill="#64748b">no reload from disk on restart</text>

  <g filter="url(#ds)">
    <rect x="620" y="500" width="520" height="78" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="880" y="540" text-anchor="middle" font-size="27" font-weight="800" fill="#15803d">engine startup: − 94%</text>
  <text x="880" y="565" text-anchor="middle" font-size="14" fill="#64748b">end-to-end, cold restart</text>

  <!-- footer -->
  <text x="60" y="608" font-size="15" font-weight="600" fill="#94a3b8">SGLang · Ant Group · Alibaba</text>
  </g>
</svg>
