<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="a2Red" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="a2Grey" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="520" fill="#ffffff"/>
  <text x="520" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Multi-Instance Weight Sharing</text>
  <text x="520" y="67" text-anchor="middle" font-size="14" fill="#475569">weights loaded &amp; quantized exactly once per GPU, then shared by every instance via zero-copy</text>

  <!-- disk (loaded once) -->
  <g filter="url(#s2)">
    <ellipse cx="86" cy="250" rx="30" ry="10" fill="#cbd5e1" stroke="#64748b" stroke-width="1.8"/>
    <path d="M56,250 V320 A30,10 0 0 0 116,320 V250" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="86" cy="250" rx="30" ry="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
  </g>
  <text x="86" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569">disk</text>
  <path d="M118,285 C140,285 150,270 168,270" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a2Grey)"/>
  <text x="150" y="255" text-anchor="middle" font-size="11" fill="#64748b">load once</text>

  <!-- GPU container -->
  <rect x="172" y="96" width="828" height="360" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="196" y="126" font-size="16" font-weight="700" fill="#475569">GPU 0</text>

  <!-- Daemon -->
  <g filter="url(#s2)">
    <rect x="210" y="176" width="270" height="220" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="345" y="214" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Weight Cache Daemon</text>
  <line x1="234" y1="230" x2="456" y2="230" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="345" y="258" text-anchor="middle" font-size="13.5" fill="#1e40af">one copy of post-quant weights</text>
  <text x="345" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">1× GPU memory</text>
  <text x="345" y="326" text-anchor="middle" font-size="13" fill="#1e40af">for N instances</text>
  <text x="345" y="366" text-anchor="middle" font-size="12" fill="#2563eb">no redundant disk I/O or re-quantization</text>

  <!-- Engines -->
  <g filter="url(#s2)">
    <rect x="700" y="150" width="270" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="700" y="240" width="270" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="700" y="330" width="270" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  </g>
  <text x="835" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Engine A</text>
  <text x="835" y="204" text-anchor="middle" font-size="12.5" fill="#166534">independent service · inst 0</text>
  <text x="835" y="271" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Engine B</text>
  <text x="835" y="294" text-anchor="middle" font-size="12.5" fill="#166534">independent service · inst 1</text>
  <text x="835" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Engine C</text>
  <text x="835" y="384" text-anchor="middle" font-size="12.5" fill="#166534">independent service · inst 2</text>

  <!-- zero-copy arrows -->
  <path d="M482,240 C580,240 600,186 696,186" fill="none" stroke="#dc2626" stroke-width="3.2" marker-end="url(#a2Red)"/>
  <path d="M482,286 L696,276" fill="none" stroke="#dc2626" stroke-width="3.2" marker-end="url(#a2Red)"/>
  <path d="M482,332 C580,332 600,366 696,366" fill="none" stroke="#dc2626" stroke-width="3.2" marker-end="url(#a2Red)"/>
  <text x="590" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">cudaIpcMemHandle · zero-copy</text>

  <!-- contrast footnote -->
  <text x="520" y="490" text-anchor="middle" font-size="12.5" fill="#64748b">Traditional loading: each instance re-reads and re-quantizes from disk (N× disk I/O, N× GPU memory).</text>
</svg>
