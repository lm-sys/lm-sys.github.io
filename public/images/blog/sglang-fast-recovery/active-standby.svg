<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="a3Red" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="a3Amber" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b45309"/>
    </marker>
    <marker id="a3Bolt" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="540" fill="#ffffff"/>
  <text x="520" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Active-Standby Failover</text>
  <text x="520" y="67" text-anchor="middle" font-size="14" fill="#475569">standby stays warm via zero-copy and promotes in &lt; 1s — no idle full-GPU replica</text>

  <!-- GPU container -->
  <rect x="40" y="92" width="960" height="340" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="66" y="122" font-size="16" font-weight="700" fill="#475569">GPU</text>

  <!-- Daemon -->
  <g filter="url(#s3)">
    <rect x="90" y="172" width="280" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="230" y="248" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Weight Cache</text>
  <text x="230" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Daemon</text>
  <text x="230" y="306" text-anchor="middle" font-size="12.5" fill="#2563eb">one weight copy, shared</text>

  <!-- Primary -->
  <g filter="url(#s3)">
    <rect x="690" y="150" width="270" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  </g>
  <text x="825" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">Primary Engine</text>
  <text x="825" y="214" text-anchor="middle" font-size="13" fill="#166534">serving live traffic</text>

  <!-- Standby -->
  <g filter="url(#s3)">
    <rect x="690" y="286" width="270" height="96" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  </g>
  <text x="825" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#a16207">Standby Engine</text>
  <text x="825" y="350" text-anchor="middle" font-size="13" fill="#854d0e">warm · maps weights, no disk</text>

  <!-- weight arrows -->
  <path d="M372,220 C500,220 540,198 686,198" fill="none" stroke="#dc2626" stroke-width="3.2" marker-end="url(#a3Red)"/>
  <path d="M372,304 C500,304 540,330 686,330" fill="none" stroke="#b45309" stroke-width="3.2" stroke-dasharray="7 5" marker-end="url(#a3Amber)"/>
  <text x="540" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">zero-copy (serving)</text>
  <text x="548" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">zero-copy (warm)</text>

  <!-- failover flash -->
  <path d="M825,250 L825,282" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#a3Bolt)"/>
  <rect x="756" y="252" width="138" height="28" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
  <text x="825" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">primary fails → &lt; 1s</text>

  <!-- comparison strip -->
  <g filter="url(#s3)">
    <rect x="90" y="456" width="410" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="540" y="456" width="410" height="60" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
  </g>
  <text x="295" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Traditional hot standby</text>
  <text x="295" y="502" text-anchor="middle" font-size="12.5" fill="#7f1d1d">dedicates a full 2nd set of GPUs (2× cost)</text>
  <text x="745" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Weight Cache standby</text>
  <text x="745" y="502" text-anchor="middle" font-size="12.5" fill="#14532d">warm on the same GPU (1× cost)</text>
</svg>
