<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
  <title id="title">Miles GET latency by payload size</title>
  <desc id="desc">On a logarithmic latency scale, Mooncake GET is 10.6 to 14.1 times faster than Ray GET across 128 MiB to 4 GiB Miles rollout payloads.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .label { font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .small { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6b7a; }
      .tick { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .value { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .moon { fill: #e4f3ee; stroke: #187a6d; stroke-width: 1.4; rx: 7; }
      .grid { stroke: #dfe5e8; stroke-width: 1.2; }
      .axis { stroke: #8996a3; stroke-width: 1.5; }
      .moon-line { fill: none; stroke: #187a6d; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
      .ray-line { fill: none; stroke: #b85c38; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="760" height="680"/>

  <line x1="430" y1="38" x2="468" y2="38" class="moon-line"/>
  <circle cx="449" cy="38" r="7" fill="#187a6d"/>
  <text x="480" y="45" class="label">Mooncake GET</text>
  <line x1="430" y1="72" x2="468" y2="72" class="ray-line"/>
  <circle cx="449" cy="72" r="7" fill="#b85c38"/>
  <text x="480" y="79" class="label">Ray GET</text>

  <g transform="translate(0 48)">
  <text x="25" y="325" class="small" text-anchor="middle" transform="rotate(-90 25 325)">GET latency · log scale</text>

  <line x1="132" y1="496" x2="715" y2="496" class="grid"/>
  <text x="116" y="502" class="tick" text-anchor="end">50ms</text>
  <line x1="132" y1="452" x2="715" y2="452" class="grid"/>
  <text x="116" y="458" class="tick" text-anchor="end">100ms</text>
  <line x1="132" y1="383" x2="715" y2="383" class="grid"/>
  <text x="116" y="389" class="tick" text-anchor="end">300ms</text>
  <line x1="132" y1="313" x2="715" y2="313" class="grid"/>
  <text x="116" y="319" class="tick" text-anchor="end">1s</text>
  <line x1="132" y1="237" x2="715" y2="237" class="grid"/>
  <text x="116" y="243" class="tick" text-anchor="end">3s</text>
  <line x1="132" y1="160" x2="715" y2="160" class="grid"/>
  <text x="116" y="166" class="tick" text-anchor="end">10s</text>
  <line x1="132" y1="90" x2="715" y2="90" class="grid"/>
  <text x="116" y="96" class="tick" text-anchor="end">30s</text>

  <line x1="132" y1="515" x2="715" y2="515" class="axis"/>
  <line x1="132" y1="90" x2="132" y2="515" class="axis"/>

  <path d="M185 350 L345 258 L505 204 L665 116" class="ray-line"/>
  <path d="M185 499 L345 417 L505 371 L665 283" class="moon-line"/>

  <circle cx="185" cy="350" r="8" fill="#b85c38"/>
  <text x="185" y="330" class="small" text-anchor="middle">501ms</text>
  <circle cx="345" cy="258" r="8" fill="#b85c38"/>
  <text x="345" y="238" class="small" text-anchor="middle">2.134s</text>
  <circle cx="505" cy="204" r="8" fill="#b85c38"/>
  <text x="505" y="184" class="small" text-anchor="middle">5.035s</text>
  <circle cx="665" cy="116" r="8" fill="#b85c38"/>
  <text x="665" y="99" class="small" text-anchor="middle">20.034s</text>

  <circle cx="185" cy="499" r="8" fill="#187a6d"/>
  <text x="185" y="541" class="small" text-anchor="middle">47ms</text>
  <rect x="144" y="454" width="82" height="34" class="moon"/>
  <text x="185" y="478" class="value" text-anchor="middle">10.6x</text>

  <circle cx="345" cy="417" r="8" fill="#187a6d"/>
  <text x="345" y="446" class="small" text-anchor="middle">173ms</text>
  <rect x="304" y="373" width="82" height="34" class="moon"/>
  <text x="345" y="397" class="value" text-anchor="middle">12.3x</text>

  <circle cx="505" cy="371" r="8" fill="#187a6d"/>
  <text x="505" y="400" class="small" text-anchor="middle">356ms</text>
  <rect x="464" y="327" width="82" height="34" class="moon"/>
  <text x="505" y="351" class="value" text-anchor="middle">14.1x</text>

  <circle cx="665" cy="283" r="8" fill="#187a6d"/>
  <text x="665" y="312" class="small" text-anchor="middle">1.426s</text>
  <rect x="624" y="239" width="82" height="34" class="moon"/>
  <text x="665" y="263" class="value" text-anchor="middle">14.1x</text>

  <line x1="185" y1="515" x2="185" y2="523" class="axis"/>
  <text x="185" y="590" class="small" text-anchor="middle">128 MiB</text>
  <line x1="345" y1="515" x2="345" y2="523" class="axis"/>
  <text x="345" y="590" class="small" text-anchor="middle">512 MiB</text>
  <line x1="505" y1="515" x2="505" y2="523" class="axis"/>
  <text x="505" y="590" class="small" text-anchor="middle">1 GiB</text>
  <line x1="665" y1="515" x2="665" y2="523" class="axis"/>
  <text x="665" y="590" class="small" text-anchor="middle">4 GiB</text>
  </g>
</svg>
