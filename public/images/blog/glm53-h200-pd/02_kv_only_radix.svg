<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Shared KV prefix and request-local KDA state</title>
<desc id="desc">Left: requests A and B on the decode worker reference the same cached KV prefix and their own suffix KV. Right: prefill sends each request its own full-prompt KDA state, which decode uses to continue generation. KV references and state transfer are shown in separate panels.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#596f83"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}</style>
<rect width="1100" height="520" rx="12" fill="white"/>
<text x="30" y="38" font-size="25" font-weight="bold" text-anchor="start">Share the KV prefix; keep KDA state request-local</text>
<rect x="25" y="68" width="500" height="390" rx="12" fill="#fafcfe" stroke="#cedbe5"/>
<rect x="550" y="68" width="525" height="390" rx="12" fill="#fafcfe" stroke="#cedbe5"/>
<text x="45" y="98" font-size="20" font-weight="bold" text-anchor="start">KV references on D</text>
<text x="570" y="98" font-size="20" font-weight="bold" text-anchor="start">KDA state transfer: P → D</text>
<rect x="45" y="125" width="135" height="75" rx="9" fill="#eaf3fb" stroke="#2374b8" stroke-width="1.5"/>
<text x="112.5" y="155" font-size="17" font-weight="bold" text-anchor="middle">Request A</text>
<text x="112.5" y="179" font-size="14" font-weight="normal" text-anchor="middle">On D</text>
<rect x="330" y="125" width="170" height="75" rx="9" fill="#fff5e4" stroke="#d89123" stroke-width="1.5"/>
<text x="415.0" y="155" font-size="17" font-weight="bold" text-anchor="middle">Suffix KV A</text>
<text x="415.0" y="179" font-size="14" font-weight="normal" text-anchor="middle">Request-local</text>
<rect x="245" y="235" width="255" height="75" rx="9" fill="#eaf3fb" stroke="#2374b8" stroke-width="1.5"/>
<text x="372.5" y="265" font-size="17" font-weight="bold" text-anchor="middle">Shared prefix KV</text>
<text x="372.5" y="289" font-size="14" font-weight="normal" text-anchor="middle">One physical allocation</text>
<rect x="45" y="345" width="135" height="75" rx="9" fill="#eaf3fb" stroke="#2374b8" stroke-width="1.5"/>
<text x="112.5" y="375" font-size="17" font-weight="bold" text-anchor="middle">Request B</text>
<text x="112.5" y="399" font-size="14" font-weight="normal" text-anchor="middle">On D</text>
<rect x="330" y="345" width="170" height="75" rx="9" fill="#fff5e4" stroke="#d89123" stroke-width="1.5"/>
<text x="415.0" y="375" font-size="17" font-weight="bold" text-anchor="middle">Suffix KV B</text>
<text x="415.0" y="399" font-size="14" font-weight="normal" text-anchor="middle">Request-local</text>
<path d="M180 152 L320 152" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180 178 L215 178 L215 255 L235 255" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180 393 L320 393" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180 367 L215 367 L215 287 L235 287" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="570" y="125" width="185" height="75" rx="9" fill="#e9f6f2" stroke="#158579" stroke-width="1.5"/>
<text x="662.5" y="155" font-size="17" font-weight="bold" text-anchor="middle">P: KDA state A</text>
<text x="662.5" y="179" font-size="14" font-weight="normal" text-anchor="middle">Prefix + suffix A</text>
<rect x="865" y="125" width="190" height="75" rx="9" fill="#e9f6f2" stroke="#158579" stroke-width="1.5"/>
<text x="960.0" y="155" font-size="17" font-weight="bold" text-anchor="middle">D: Request A</text>
<text x="960.0" y="179" font-size="14" font-weight="normal" text-anchor="middle">Use state A</text>
<rect x="570" y="345" width="185" height="75" rx="9" fill="#e9f6f2" stroke="#158579" stroke-width="1.5"/>
<text x="662.5" y="375" font-size="17" font-weight="bold" text-anchor="middle">P: KDA state B</text>
<text x="662.5" y="399" font-size="14" font-weight="normal" text-anchor="middle">Prefix + suffix B</text>
<rect x="865" y="345" width="190" height="75" rx="9" fill="#e9f6f2" stroke="#158579" stroke-width="1.5"/>
<text x="960.0" y="375" font-size="17" font-weight="bold" text-anchor="middle">D: Request B</text>
<text x="960.0" y="399" font-size="14" font-weight="normal" text-anchor="middle">Use state B</text>
<path d="M755 163 L855 163" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M755 383 L855 383" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="805" y="145" font-size="14" font-weight="normal" text-anchor="middle">NIXL</text>
<text x="805" y="365" font-size="14" font-weight="normal" text-anchor="middle">NIXL</text>
<text x="812" y="258" font-size="17" font-weight="normal" text-anchor="middle">Each state represents its</text>
<text x="812" y="284" font-size="17" font-weight="bold" text-anchor="middle">own completed input.</text>
<text x="30" y="494" font-size="18" font-weight="normal" text-anchor="start">Only missing KV is transferred; each request receives its own full-prompt KDA state.</text>
</svg>
