<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Larger KV tiles reduce sparse attention loop overhead</title><desc id="desc">The same selected KV positions are processed with block32 or block128. An index width of2112 requires66 iterations at block32 or17 iterations with a virtual extent of2176 at block128. Extra indices are masked. Split remains one and each CUDA block uses128 threads.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#596f83"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17324d} .sub{fill:#596f83}</style>
<rect width="1100" height="500" rx="12" fill="white"/>
<text x="35" y="42" font-size="25" font-weight="bold" text-anchor="start">Sparse attention: larger tiles, fewer online-softmax updates</text>
<rect x="35" y="88" width="220" height="76" rx="10" fill="#eaf3fb" stroke="#2374b8" stroke-width="1.5"/>
<text x="145.0" y="119" font-size="19" font-weight="bold" text-anchor="middle">Indexer + top-k</text>
<text x="145.0" y="145" font-size="15" font-weight="normal" text-anchor="middle" style="fill:#596f83">Select KV positions</text>
<path d="M255 126 L300 126" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="88" width="330" height="76" rx="10" fill="#eaf3fb" stroke="#2374b8" stroke-width="1.5"/>
<text x="480.0" y="119" font-size="19" font-weight="bold" text-anchor="middle">Partial</text>
<text x="480.0" y="145" font-size="15" font-weight="normal" text-anchor="middle" style="fill:#596f83">QKᵀ → online softmax → weighted V</text>
<path d="M645 126 L690 126" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="705" y="88" width="185" height="76" rx="10" fill="#eaf3fb" stroke="#2374b8" stroke-width="1.5"/>
<text x="797.5" y="119" font-size="19" font-weight="bold" text-anchor="middle">Combine</text>
<text x="797.5" y="145" font-size="15" font-weight="normal" text-anchor="middle" style="fill:#596f83">Merge split outputs</text>
<text x="35" y="219" font-size="19" font-weight="bold" text-anchor="start">Index-table width = 2,112; valid selected positions are unchanged.</text>
<text x="35" y="283" font-size="19" font-weight="bold" text-anchor="start">block32: 66 iterations</text>


































































<text x="35" y="363" font-size="19" font-weight="bold" text-anchor="start">block128: 17 iterations</text>

















<text x="35" y="424" font-size="18" font-weight="normal" text-anchor="start">block128 virtually covers 2,176 positions; out-of-range indices are masked.</text>
<text x="35" y="463" font-size="18" font-weight="bold" text-anchor="start">split = 1 · 128 threads / CUDA block · same effective KV positions</text>
