<text x="407.5" y="387" font-size="15" font-weight="normal" text-anchor="middle" style="fill:#596f83">4 H200 · TP + CP</text>
<path d="M200 245 L270 370" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M530 370 L645 370" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M645 140 L645 370" fill="none" stroke="#596f83" stroke-width="2"/>
<path d="M645 255 L780 255" fill="none" stroke="#596f83" stroke-width="2" marker-end="url(#arrow)"/>
<text x="655" y="198" font-size="19" font-weight="bold" text-anchor="start">NIXL</text>
<text x="655" y="224" font-size="15" font-weight="normal" text-anchor="start">Missing KV</text>
