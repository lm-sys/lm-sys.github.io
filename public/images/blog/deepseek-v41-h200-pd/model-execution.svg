<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1045" viewBox="0 0 1200 1045" role="img" aria-labelledby="title description">
<title id="title">Model execution and the six optimization sites</title>
<desc id="description">Prefill chunks execute layers 0 through 20 over all rows. Layer 20 supplies compressed history for later layers, optionally run on a 128-token SWA tail. An Indexer either uses dense scoring with alignment and eligible fused postprocessing or candidate-only scoring with its own Torch postprocessing. Attention reads selected history and the local window, then MoE runs. Compact final and auxiliary states are gathered before handoff to DSpark Decode.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="1045" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="34" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">DeepSeek-V4.1: where the six changes act</tspan></text>
<text x="40" y="105" font-size="26" fill="#2764c5" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Prefill: [4] choose chunk size → schedule each uncached prompt chunk</tspan></text>
<rect x="40" y="140" width="310" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="195.0" y="181.0" font-size="25" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="195.0" dy="0">Layers 0–20</tspan><tspan x="195.0" dy="35.0">Process full chunk</tspan></text>
<path d="M360,190 L411,190" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="420" y="140" width="320" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="580.0" y="181.0" font-size="25" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="580.0" dy="0">Layer 20 source</tspan><tspan x="580.0" dy="35.0">Compressed KV + keys</tspan></text>
<path d="M750,190 L801,190" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="140" width="350" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="985.0" y="181.72" font-size="23" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="985.0" dy="0">Layers 21–39 reuse history</tspan><tspan x="985.0" dy="32.199999999999996">[6] Optional 128-token tail</tspan></text>
<text x="40" y="292" font-size="27" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Inside a layer with an Indexer: select compressed keys before attention</tspan></text>
<rect x="40" y="325" width="540" height="130" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="310.0" y="363.5" font-size="25" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="310.0" dy="0">Dense publisher / fallback</tspan><tspan x="310.0" dy="35.0">[1] Pad K → regular BF16 score GEMM</tspan><tspan x="310.0" dy="35.0">[3] Fused epilogue when eligible</tspan></text>
<rect x="620" y="325" width="540" height="130" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="890.0" y="364.56" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="890.0" dy="0">Candidate consumer: own query + weights</tspan><tspan x="890.0" dy="33.599999999999994">[2] Load published candidate keys → score</tspan><tspan x="890.0" dy="33.599999999999994">Own Torch epilogue (no [3] call here)</tspan></text>
<path d="M310,465 L310,503" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M890,465 L890,503" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="512" width="1120" height="85" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="600.0" y="545.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="600.0" dy="0">Mask + top-k → map selected columns to logical keys → physical KV slots</tspan><tspan x="600.0" dy="33.599999999999994">Consumers reuse published block IDs and compute their own scores</tspan></text>
<path d="M310,607 L310,642" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="650" width="540" height="90" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="310.0" y="686.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="310.0" dy="0">Attention: selected compressed KV + SWA</tspan><tspan x="310.0" dy="33.599999999999994">Own attention weights → combine values</tspan></text>
<path d="M590,695 L611,695" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="620" y="650" width="540" height="90" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="890.0" y="686.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="890.0" dy="0">MoE → continue layer stack</tspan><tspan x="890.0" dy="33.599999999999994">[5] Reduce-scatter to owned MoE rows</tspan></text>
<text x="40" y="792" font-size="24" fill="#2764c5" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Prefill output: [6] gather final + DSpark auxiliary states with original token positions</tspan></text>
<rect x="40" y="825" width="340" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="210.0" y="866.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="210.0" dy="0">KV + required model state</tspan><tspan x="210.0" dy="33.599999999999994">P → D handoff</tspan></text>
<path d="M390,875 L411,875" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="420" y="825" width="350" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="595.0" y="866.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="595.0" dy="0">DSpark draft proposals</tspan><tspan x="595.0" dy="33.599999999999994">Target verifies blocks</tspan></text>
<rect x="810" y="825" width="350" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="985.0" y="866.72" font-size="23" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="985.0" dy="0">[4] Decode graph metadata</tspan><tspan x="985.0" dy="32.199999999999996">Avoid capture host reads</tspan></text>
<text x="40" y="986" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Layer view is schematic: only Indexer source layers score; other layers can reuse a selection.</tspan></text></g>
</svg>
