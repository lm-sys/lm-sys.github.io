<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">PR 46003: move the candidate restriction before scoring</title>
<desc id="description">Use published candidate block IDs to load only eligible keys. Score compact candidate columns and map top-k back through block IDs to logical positions and KV slots.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="675" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="32" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">4. Score only positions that the consumer can select</tspan></text>
<text x="40" y="115" font-size="26" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Before: score all visible keys, then gather candidate scores</tspan></text>
<rect x="40" y="150" width="300" height="95" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="190.0" y="188.85999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">Q × all visible K</tspan><tspan x="190.0" dy="33.599999999999994">Per-head width L</tspan></text>
<path d="M350,198 L401,198" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="410" y="150" width="330" height="95" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="575.0" y="188.85999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="575.0" dy="0">Full score tensor</tspan><tspan x="575.0" dy="33.599999999999994">[T, H, L]</tspan></text>
<path d="M750,198 L801,198" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="150" width="350" height="95" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="985.0" y="188.85999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="985.0" dy="0">Gather candidate scores</tspan><tspan x="985.0" dy="33.599999999999994">Top-k within candidates</tspan></text>
<path d="M40,285 H1160" stroke="#cbd7e4"/>
<text x="40" y="340" font-size="26" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">After: candidate IDs determine the key loads before the dot product</tspan></text>
<rect x="40" y="375" width="300" height="110" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="190.0" y="421.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">Published candidate blocks</tspan><tspan x="190.0" dy="33.599999999999994">Gather K inside Triton</tspan></text>
<path d="M350,430 L401,430" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="410" y="375" width="330" height="110" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="575.0" y="421.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="575.0" dy="0">Q × candidate K</tspan><tspan x="575.0" dy="33.599999999999994">[T, H, C], C ≤ L / 2</tspan></text>
<path d="M750,430 L801,430" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="375" width="350" height="110" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="985.0" y="421.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="985.0" dy="0">Mask + compact top-k</tspan><tspan x="985.0" dy="33.599999999999994">Map columns → positions</tspan></text>
<text x="40" y="548" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Position = block_ID × block_size + offset; then map to the physical KV slot.</tspan></text>
<text x="40" y="590" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">The candidate publisher and candidate budget are unchanged.</tspan></text>
<text x="40" y="632" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">The tested consumer path keeps the reference ReLU, weights, and head reduction.</tspan></text></g>
</svg>
