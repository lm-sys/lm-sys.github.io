<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">PR 45807: fuse post-GEMM score processing with BF16 parity</title>
<desc id="description">Keep GEMM and its per-head BF16 score output. Fuse ReLU, head weighting, head reduction, and FP32 conversion, retaining the intermediate BF16 rounding and tested Torch accumulation order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="675" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="32" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">3. Remove repeated memory traffic after the score GEMM</tspan></text>
<text x="40" y="116" font-size="26" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Before: separate operations materialize large intermediates</tspan></text>
<rect x="40" y="150" width="220" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="150.0" y="191.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="150.0" dy="0">GEMM</tspan><tspan x="150.0" dy="33.599999999999994">[T, 32, L] BF16</tspan></text>
<path d="M270,200 L301,200" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="310" y="150" width="190" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="405.0" y="191.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="405.0" dy="0">ReLU</tspan><tspan x="405.0" dy="33.599999999999994">BF16 tensor</tspan></text>
<path d="M510,200 L541,200" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="550" y="150" width="190" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="645.0" y="192.07999999999998" font-size="22" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="645.0" dy="0">× head weight</tspan><tspan x="645.0" dy="30.799999999999997">BF16 tensor</tspan></text>
<path d="M750,200 L781,200" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="790" y="150" width="370" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="975.0" y="191.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="975.0" dy="0">Sum heads → BF16</tspan><tspan x="975.0" dy="33.599999999999994">Convert [T, L] to FP32</tspan></text>
<path d="M40,290 H1160" stroke="#cbd7e4"/>
<text x="40" y="345" font-size="26" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">After: one Triton epilogue after the same GEMM</tspan></text>
<rect x="40" y="380" width="250" height="115" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="165.0" y="428.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="165.0" dy="0">Unchanged GEMM</tspan><tspan x="165.0" dy="33.599999999999994">[T, 32, L] BF16</tspan></text>
<path d="M300,438 L351,438" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="360" y="380" width="490" height="115" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="605.0" y="429.21999999999997" font-size="23" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="605.0" dy="0">Fused: ReLU → weight → head sum</tspan><tspan x="605.0" dy="32.199999999999996">BF16 rounding + Torch reduction order</tspan></text>
<path d="M860,438 L911,438" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="920" y="380" width="240" height="115" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="1040.0" y="428.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="1040.0" dy="0">Final scores</tspan><tspan x="1040.0" dy="33.599999999999994">[T, L] FP32</tspan></text>
<text x="40" y="562" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">The per-head GEMM output still exists; later full-size intermediate tensors disappear.</tspan></text>
<text x="40" y="605" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Context-dependent strides stay runtime scalars to avoid per-length specialization.</tspan></text>
<text x="40" y="648" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Unsupported devices, dtypes, head counts, widths, or layouts use the Torch fallback.</tspan></text></g>
</svg>
