<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title description">
<title id="title">PR 47247: return only the reduced rows owned by each CP rank</title>
<desc id="description">Four partial full-row inputs sum to Y, split into S0 through S3. All-reduce replicates all four shards on every rank before slicing. Reduce-scatter gives rank r only Sr. Output size, collective duration, and request critical-path latency are different quantities.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="855" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="32" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">5. Match MoE output communication to CP row ownership</tspan></text>
<text x="40" y="100" font-size="22" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Rank-major MoE buffer: Y = [S0 | S1 | S2 | S3]</tspan><tspan x="40" dy="30.799999999999997">CP4 interleave: S0 = tokens [0, 4, 8, 12]; S1 = [1, 5, 9, 13] (16-token example)</tspan></text>
<rect x="40" y="150" width="260" height="90" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="170.0" y="185.64000000000001" font-size="26" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="170.0" dy="0">Before</tspan><tspan x="170.0" dy="36.4">All-reduce Y</tspan></text>
<path d="M310,195 L356,195" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="365" y="145" width="795" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="762.5" y="186.0" font-size="25" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="762.5" dy="0">Every rank receives [S0 | S1 | S2 | S3]</tspan><tspan x="762.5" dy="35.0">Then rank r keeps only Sr + makes a contiguous copy</tspan></text>
<text x="40" y="295" font-size="26" fill="#087e79" font-weight="700" text-anchor="start"><tspan x="40" dy="0">After: reduce-scatter returns the owned shard directly</tspan></text>
<rect x="40" y="325" width="260" height="90" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="170.0" y="360.64" font-size="26" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="170.0" dy="0">Rank 0</tspan><tspan x="170.0" dy="36.4">S0</tspan></text>
<rect x="325" y="325" width="265" height="90" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="457.5" y="360.64" font-size="26" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="457.5" dy="0">Rank 1</tspan><tspan x="457.5" dy="36.4">S1</tspan></text>
<rect x="615" y="325" width="265" height="90" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="747.5" y="360.64" font-size="26" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="747.5" dy="0">Rank 2</tspan><tspan x="747.5" dy="36.4">S2</tspan></text>
<rect x="905" y="325" width="255" height="90" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="1032.5" y="360.64" font-size="26" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="1032.5" dy="0">Rank 3</tspan><tspan x="1032.5" dy="36.4">S3</tspan></text>
<text x="40" y="465" font-size="24" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Per-rank output: 1/4 of Y. Full-row inputs can remain; wire traffic is not inferred here.</tspan></text>
<path d="M40,505 H1160" stroke="#cbd7e4"/>
<text x="40" y="550" font-size="27" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Different measurement scopes</tspan></text>
<rect x="40" y="580" width="340" height="110" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="210.0" y="609.56" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="210.0" dy="0">Collective duration</tspan><tspan x="210.0" dy="33.599999999999994">Mean sum / rank</tspan><tspan x="210.0" dy="33.599999999999994">↓ 19.4%–21.7%</tspan></text>
<rect x="410" y="580" width="350" height="110" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="585.0" y="609.56" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="585.0" dy="0">Forward GPU span</tspan><tspan x="585.0" dy="33.599999999999994">Slowest rank / step</tspan><tspan x="585.0" dy="33.599999999999994">606.244 → 595.320 ms</tspan></text>
<rect x="790" y="580" width="370" height="110" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="975.0" y="609.56" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="975.0" dy="0">Request E2E</tspan><tspan x="975.0" dy="33.599999999999994">Queue + P + handoff + D</tspan><tspan x="975.0" dy="33.599999999999994">↓ 0.8%–3.4%</tspan></text>
<text x="40" y="739" font-size="22" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">A saved collective interval shortens the forward only if it advances the limiting dependency chain.</tspan></text>
<text x="40" y="785" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">These are measured summaries, not a matched critical-path timeline or a 4× speedup claim.</tspan></text></g>
</svg>
