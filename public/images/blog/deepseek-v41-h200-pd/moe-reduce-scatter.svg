<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title description">
<title id="title">PR 47247: return only the reduced rows owned by each CP rank</title>
<desc id="description">On the contiguous CP MoE path with TP=CP=4, replace all-reduce plus local slicing with reduce-scatter. Each rank receives its own quarter of the reduced output.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="635" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="32" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">3. Match MoE output communication to CP row ownership</tspan></text>
<text x="40" y="115" font-size="25" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Before: every rank receives all reduced rows, then keeps one quarter</tspan></text>
<rect x="40" y="150" width="300" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="190.0" y="191.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">Expert partial output</tspan><tspan x="190.0" dy="33.599999999999994">Full row extent</tspan></text>
<path d="M350,200 L401,200" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="410" y="150" width="330" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="575.0" y="191.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="575.0" dy="0">All-reduce</tspan><tspan x="575.0" dy="33.599999999999994">Full result on every rank</tspan></text>
<path d="M750,200 L801,200" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="150" width="350" height="100" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="985.0" y="191.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="985.0" dy="0">Split by CP rank</tspan><tspan x="985.0" dy="33.599999999999994">+ contiguous copy</tspan></text>
<path d="M40,290 H1160" stroke="#cbd7e4"/>
<text x="40" y="345" font-size="25" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">After: reduce and return the local row shard directly</tspan></text>
<rect x="40" y="380" width="300" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="190.0" y="421.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">Expert partial output</tspan><tspan x="190.0" dy="33.599999999999994">Same numerical task</tspan></text>
<path d="M350,430 L401,430" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="410" y="380" width="330" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="575.0" y="421.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="575.0" dy="0">Reduce-scatter</tspan><tspan x="575.0" dy="33.599999999999994">TP = CP = group size</tspan></text>
<path d="M750,430 L801,430" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="380" width="350" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="985.0" y="421.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="985.0" dy="0">Rank r: its reduced rows</tspan><tspan x="985.0" dy="33.599999999999994">1/4 of full output at CP4</tspan></text>
<text x="40" y="548" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Gate: contiguous CP path, CUDA/non-HIP, nonempty rows divisible by CP size.</tspan></text>
<text x="40" y="588" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">A smaller result per rank is not a 4× claim for collective speed or E2E latency.</tspan></text></g>
</svg>
