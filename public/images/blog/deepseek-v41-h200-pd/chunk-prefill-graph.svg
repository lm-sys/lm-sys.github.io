<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
<title id="title">Larger Prefill chunks and Decode graph metadata</title>
<desc id="description">An illustrative 16384-token uncached suffix uses two 8192-token chunks or one 16384-token chunk. PR 46777 separately removes an unused Decode capture scalar read and guards glue when host lengths are required.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="690" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="31" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">4. Increase Prefill chunks; audit Decode graph metadata</tspan></text>
<text x="40" y="112" font-size="26" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Illustrative uncached suffix: 16,384 tokens</tspan></text>
<text x="40" y="175" font-size="24" fill="#50627a" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Chunk = 8,192</tspan></text>
<rect x="300" y="140" width="310" height="85" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="455.0" y="173.85999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="455.0" dy="0">Prefill forward</tspan><tspan x="455.0" dy="33.599999999999994">8,192 tokens</tspan></text>
<path d="M620,183 L740,183" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="680" y="150" font-size="19" fill="#50627a" font-weight="400" text-anchor="middle"><tspan x="680" dy="0">Next round</tspan></text>
<rect x="750" y="140" width="410" height="85" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="955.0" y="173.85999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="955.0" dy="0">Prefill forward</tspan><tspan x="955.0" dy="33.599999999999994">8,192 tokens</tspan></text>
<text x="40" y="285" font-size="24" fill="#50627a" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Chunk = 16,384</tspan></text>
<rect x="300" y="250" width="860" height="85" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="730.0" y="283.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="730.0" dy="0">One Prefill forward: 16,384 tokens</tspan><tspan x="730.0" dy="33.599999999999994">Fewer chunk boundaries and scheduling rounds</tspan></text>
<path d="M40,380 H1160" stroke="#cbd7e4"/>
<text x="40" y="432" font-size="27" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Related work: PR #46777 on Decode metadata</tspan></text>
<rect x="40" y="470" width="520" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="300.0" y="511.36" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="300.0" dy="0">Unused seq_lens.sum().item()</tspan><tspan x="300.0" dy="33.599999999999994">Remove the host scalar read</tspan></text>
<rect x="600" y="470" width="560" height="100" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="880.0" y="511.71999999999997" font-size="23" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="880.0" dy="0">Backend requires host sequence lengths?</tspan><tspan x="880.0" dy="32.199999999999996">Decline the draft metadata glue graph</tspan></text>
<text x="40" y="619" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">The host-length guard is defensive for the current DSpark configuration.</tspan></text>
<text x="40" y="659" font-size="23" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">The table reports the chunk experiment; it does not isolate the guard&#x27;s impact.</tspan></text></g>
</svg>
