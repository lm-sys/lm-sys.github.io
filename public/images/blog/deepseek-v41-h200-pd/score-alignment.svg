<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
<title id="title">PR 45794: align the physical score width</title>
<desc id="description">Zero-pad dequantized keys from visible length L to ceil(L/64)*64 once per request. Score query chunks at the aligned width, slice to L, and mask before selection.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50627a"/></marker></defs>
<rect width="1200" height="600" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="55" font-size="32" fill="#18283e" font-weight="700" text-anchor="start"><tspan x="40" dy="0">1. Give the BF16 GEMM an aligned physical width</tspan></text>
<text x="40" y="118" font-size="27" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Before: logical and physical width = 28,799</tspan></text>
<rect x="40" y="150" width="300" height="90" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="190.0" y="186.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">Query rows × heads</tspan><tspan x="190.0" dy="33.599999999999994">Q: [T, H, 128]</tspan></text>
<path d="M350,195 L405,195" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="415" y="150" width="315" height="90" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="572.5" y="186.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="572.5" dy="0">Visible index keys</tspan><tspan x="572.5" dy="33.599999999999994">K: [28,799, 128]</tspan></text>
<path d="M740,195 L795,195" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="805" y="150" width="355" height="90" rx="10" fill="#edf3fc" stroke="#cbd7e4"/><text x="982.5" y="186.35999999999999" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="982.5" dy="0">Unaligned score width</tspan><tspan x="982.5" dy="33.599999999999994">Shape-sensitive GEMM</tspan></text>
<path d="M40,280 H1160" stroke="#cbd7e4"/>
<text x="40" y="330" font-size="27" fill="#18283e" font-weight="600" text-anchor="start"><tspan x="40" dy="0">After: logical width = 28,799; physical width = 28,800</tspan></text>
<rect x="40" y="365" width="300" height="95" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="190.0" y="403.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">Dequantize K</tspan><tspan x="190.0" dy="33.599999999999994">+ zero-pad once</tspan></text>
<path d="M350,413 L405,413" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="415" y="365" width="315" height="95" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="572.5" y="403.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="572.5" dy="0">Aligned BF16 GEMM</tspan><tspan x="572.5" dy="33.599999999999994">Reuse K across chunks</tspan></text>
<path d="M740,413 L795,413" stroke="#50627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="805" y="365" width="355" height="95" rx="10" fill="#e8f5f0" stroke="#cbd7e4"/><text x="982.5" y="403.86" font-size="24" fill="#18283e" font-weight="400" text-anchor="middle"><tspan x="982.5" dy="0">Slice scores to 28,799</tspan><tspan x="982.5" dy="33.599999999999994">Causal mask → top-k</tspan></text>
<text x="40" y="527" font-size="24" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Padding changes the physical layout; padded columns cannot enter selection.</tspan></text>
<text x="40" y="566" font-size="24" fill="#50627a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Chunk sizing uses the padded width to preserve the score-memory budget.</tspan></text></g>
</svg>
