<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="396pt" viewBox="0 0 662.4 396" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Muse Spark NVFP4 Perf on SGLang</title>
<desc id="chart-desc">OpenHands on eight B300 GPUs with TP8/EP8 and DFlash v2. Seven measured points, with C64 omitted. C128 is selected from the HiCache 200 GB/rank rerun; remaining points use 160 GB/rank at C16 and above, with HiCache off below C16. Both runs simulate acceptance length 4.5. Throughput includes cached prompt tokens; interactivity is 1000/p50 TPOT(ms).</desc>

