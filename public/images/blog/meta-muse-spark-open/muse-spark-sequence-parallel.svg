<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="674" viewBox="0 0 1400 674" role="img" aria-labelledby="title description">
  <title id="title">Sequence-parallel prefill with NVFP4 MegaMoE</title>
  <desc id="description">Four TP/EP ranks keep distinct token shards. After attention output reduce-scatter, each rank performs normalization and pooling for its own tokens. Inside MegaMoE, all-to-all dispatch sends routed tokens to expert owners, NVFP4 expert computation applies per-expert RMSNorm before route weighting, and all-to-all combine returns complete weighted outputs to each original token rank. Unpooling and boundary normalization stay sequence-sharded until the next QKV all-gather. Lines illustrate possible routes, not measured traffic or timing.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34995a"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#858e99"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222426; }
      .muted { fill: #727872; }
      .green { fill: #2c8d4e; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; }
    </style>
  </defs>
