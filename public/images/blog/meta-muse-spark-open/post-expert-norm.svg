<title id="title">Post-expert normalization: local work and NVLink communication</title><desc id="desc">Three panels with an expert GPU lane above a token-owner GPU lane. Green arrows cross the GPU boundary. The illustrative unfused baseline normalizes on the expert GPU before returning output.</desc>
